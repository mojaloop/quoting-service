  - vulnerability: GHSA-v245-v573-v5vm
    include-aliases: true
    reason: >-
      linkify-it quadratic DoS in the mailto: validator scan-loop - same build-time API-doc generation path
      (shins/widdershins via markdown-it@12.3.2); linkify-it is pinned to 3.0.3 by that markdown-it version,
      and jumping to the fixed 5.0.2+ line is a two-major bump that markdown-it 12.x doesn't support. Not
      runtime-exploitable. Matches audit-ci.jsonc allowlist.
